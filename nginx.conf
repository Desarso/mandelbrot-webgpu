server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed bundles are immutable; the HTML entry points are not.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html { add_header Cache-Control "no-cache"; }

    # Multi-page build: index, tech, gpu and selftest are all real files, so
    # fall back to index.html only for paths that do not exist.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 1024;
}
